    function hojeISO() {
      const d = new Date();
      const ano = d.getFullYear();
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function fmtData(iso) {
      if (!iso) return '';
      const partes = String(iso).split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return String(iso);
    }

    function novoId() {
      return 'f_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    }

    function normalizarTexto(txt) {
      return String(txt || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    // IndexedDB local
    const DB_NAME = 'oftalmo_hva_standalone_db';
    const DB_VERSION = 1;
    const STORE_NAME = 'fichas';

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    const FichasDB = {
      async salvar(ficha) {
        const db = await abrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(ficha);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },
      async listar() {
        const db = await abrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      },
      async obter(id) {
        const db = await abrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      },
      async excluir(id) {
        const db = await abrirDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }
    };

      function base64ToBlob(base64, mimeType = 'audio/mp3') {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        return new Blob([bytes], { type: mimeType });
      }

      function blobParaBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const res = reader.result;
            if (typeof res === 'string') {
              const base64 = res.includes(',') ? res.split(',')[1] : res;
              resolve(base64);
            } else {
              reject(new Error('Erro ao ler blob'));
            }
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function baixarBlobMp3(blob, nomeArquivo) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = nomeArquivo.endsWith('.mp3') ? nomeArquivo : nomeArquivo + '.mp3';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }

      function fmtSegundos(s) {
        const min = Math.floor(s / 60);
        const sec = s % 60;
        return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      }

      // Converte e transcreve bloco de 5 minutos
      async function processarSegmento(segId, numero, tempoInicio, tempoFim, blob) {
        setSegmentos(prev => prev.map(s => s.id === segId ? { ...s, status: 'convertendo' } : s));
        try {
          const base64 = await blobParaBase64(blob);
          let mp3Blob = null;
          let mp3Url = null;

          try {
            const convRes = await fetch(API_BASE + '/api/audio/convert-mp3', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ audioBase64: base64, mimeType: blob.type })
            });
            if (convRes.ok) {
              const data = await convRes.json();
              mp3Blob = base64ToBlob(data.mp3Base64, 'audio/mp3');
              mp3Url = URL.createObjectURL(mp3Blob);
            }
          } catch (e) {
            console.warn('Erro ao converter bloco para MP3 no servidor:', e);
          }

          setSegmentos(prev => prev.map(s => s.id === segId ? { ...s, status: 'transcrevendo', mp3Blob, mp3Url } : s));

          // Transcrever com Gemini
          let textoTranscrito = '';
          try {
            const transRes = await fetch(API_BASE + '/api/gemini/transcribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ audioBase64: base64, mimeType: blob.type })
            });
            if (transRes.ok) {
              const tData = await transRes.json();
              textoTranscrito = (tData.text || '').trim();
            }
          } catch (e) {
            console.warn('Erro ao transcrever bloco:', e);
          }

          if (textoTranscrito) {
            setTranscricao(prev => {
              const nova = (prev + '\n\n--- [Bloco ' + numero + ': ' + tempoInicio + ' às ' + tempoFim + '] ---\n' + textoTranscrito).trim();
              return nova;
            });
          }

          setSegmentos(prev => prev.map(s => s.id === segId ? {
            ...s,
            status: 'concluido',
            mp3Blob: mp3Blob || blob,
            mp3Url: mp3Url || URL.createObjectURL(blob),
            transcricao: textoTranscrito || '[Nenhuma fala identificada]'
          } : s));
        } catch (err) {
          setSegmentos(prev => prev.map(s => s.id === segId ? { ...s, status: 'erro' } : s));
        }
      }

      function iniciarGravadorBloco(numero, inicioSeg) {
        if (!streamRef.current) return;
        currentBlockChunksRef.current = [];
        blocoNumeroRef.current = numero;
        blocoInicioSecRef.current = inicioSeg;
        setBlocoAtualNumero(numero);
        setSegundosNoBloco(0);
        tempoAcumuladoBlocoRef.current = 0;
        inicioBlocoRef.current = Date.now();

        const rec = new MediaRecorder(streamRef.current);
        rec.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            currentBlockChunksRef.current.push(e.data);
            masterChunksRef.current.push(e.data);
          }
        };
        rec.start(1000);
        recRef.current = rec;
      }

      function rotacionarSegmento5Min() {
        if (!recRef.current || !streamRef.current) return;
        const numAtual = blocoNumeroRef.current;
        const inicioSeg = blocoInicioSecRef.current;
        const fimSeg = inicioSeg + DURACAO_BLOCO;
        const tempoInicio = fmtSegundos(inicioSeg);
        const tempoFim = fmtSegundos(fimSeg);
        const segId = 'seg_' + numAtual + '_' + Date.now();
        const oldRec = recRef.current;
        const segChunks = [...currentBlockChunksRef.current];

        // Inicia próximo bloco sem perder captura
        iniciarGravadorBloco(numAtual + 1, fimSeg);

        oldRec.onstop = () => {
          const segBlob = new Blob(segChunks, { type: oldRec.mimeType || 'audio/webm' });
          const novoSeg = {
            id: segId,
            numero: numAtual,
            tempoInicio,
            tempoFim,
            blobWebm: segBlob,
            status: 'convertendo'
          };
          setSegmentos(prev => [...prev, novoSeg]);
          mostrarAviso('⏳ Bloco ' + numAtual + ' (' + tempoInicio + '-' + tempoFim + ') gravado! Convertendo em MP3 e transcrevendo...');
          processarSegmento(segId, numAtual, tempoInicio, tempoFim, segBlob);
        };

        try { oldRec.stop(); } catch (e) {}
      }

      // Gravador de áudio com suporte a blocos de 5 min, pausa/retomada e MP3
      async function iniciarGravacao() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          streamRef.current = stream;
          masterChunksRef.current = [];
          currentBlockChunksRef.current = [];
          setSegmentos([]);
          setMasterMp3Blob(null);
          setMasterMp3Url(null);
          setAudioUrl(null);
          setAudioBlob(null);
          setSegundos(0);
          setSegundosNoBloco(0);
          tempoAcumuladoTotalRef.current = 0;
          tempoAcumuladoBlocoRef.current = 0;
          inicioGravacaoTotalRef.current = Date.now();
          inicioBlocoRef.current = Date.now();
          setPausado(false);

          // Audio keep-alive para celular não suspender gravação com tela bloqueada
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              const actx = new AudioContextClass();
              const osc = actx.createOscillator();
              const gain = actx.createGain();
              gain.gain.setValueAtTime(0.00001, actx.currentTime);
              osc.connect(gain);
              gain.connect(actx.destination);
              osc.start();
              actxRef.current = actx;
            }
          } catch {}

          if ('wakeLock' in navigator) {
            try {
              wakeLockRef.current = await navigator.wakeLock.request('screen');
            } catch {}
          }

          iniciarGravadorBloco(1, 0);
          setGravando(true);
          setPausado(false);

          clearInterval(timerRelRef.current);
          timerRelRef.current = setInterval(() => {
            const decorridoTotal = tempoAcumuladoTotalRef.current + Math.floor((Date.now() - inicioGravacaoTotalRef.current) / 1000);
            setSegundos(decorridoTotal);

            const decorridoBloco = tempoAcumuladoBlocoRef.current + Math.floor((Date.now() - inicioBlocoRef.current) / 1000);
            setSegundosNoBloco(decorridoBloco);

            if (decorridoBloco >= DURACAO_BLOCO) {
              rotacionarSegmento5Min();
            }
          }, 1000);

          mostrarAviso('🎙️ Gravação iniciada! A cada 5 minutos gera bloco independente em MP3 com transcrição automática.');
        } catch (err) {
          alert('Não foi possível acessar o microfone: ' + err.message);
        }
      }

      function pausarGravacao() {
        if (!recRef.current || recRef.current.state !== 'recording') return;
        recRef.current.pause();
        clearInterval(timerRelRef.current);
        tempoAcumuladoTotalRef.current += Math.floor((Date.now() - inicioGravacaoTotalRef.current) / 1000);
        tempoAcumuladoBlocoRef.current += Math.floor((Date.now() - inicioBlocoRef.current) / 1000);
        setPausado(true);
        mostrarAviso('⏸️ Gravação pausada na mesma consulta.');
      }

      function retomarGravacao() {
        if (!recRef.current || recRef.current.state !== 'paused') return;
        inicioGravacaoTotalRef.current = Date.now();
        inicioBlocoRef.current = Date.now();
        recRef.current.resume();
        setPausado(false);

        clearInterval(timerRelRef.current);
        timerRelRef.current = setInterval(() => {
          const decorridoTotal = tempoAcumuladoTotalRef.current + Math.floor((Date.now() - inicioGravacaoTotalRef.current) / 1000);
          setSegundos(decorridoTotal);

          const decorridoBloco = tempoAcumuladoBlocoRef.current + Math.floor((Date.now() - inicioBlocoRef.current) / 1000);
          setSegundosNoBloco(decorridoBloco);

          if (decorridoBloco >= DURACAO_BLOCO) {
            rotacionarSegmento5Min();
          }
        }, 1000);

        mostrarAviso('▶️ Gravação retomada.');
      }

      async function pararGravacao() {
        clearInterval(timerRelRef.current);
        setGravando(false);
        setPausado(false);

        const numFinal = blocoNumeroRef.current;
        const inicioSegFinal = blocoInicioSecRef.current;
        const tempoTotalFinal = segundos;
        const duracaoBlocoFinal = tempoTotalFinal - inicioSegFinal;
        const lastBlockChunks = [...currentBlockChunksRef.current];

        if (recRef.current && recRef.current.state !== 'inactive') {
          try { recRef.current.stop(); } catch (e) {}
        }
        if (streamRef.current) {
          try { streamRef.current.getTracks().forEach(t => t.stop()); } catch (e) {}
          streamRef.current = null;
        }
        if (actxRef.current) {
          try { actxRef.current.close(); } catch (e) {}
          actxRef.current = null;
        }
        if (wakeLockRef.current) {
          try { wakeLockRef.current.release(); } catch (e) {}
          wakeLockRef.current = null;
        }

        // Processa bloco final se durou > 1s
        if (duracaoBlocoFinal >= 1 && lastBlockChunks.length > 0) {
          const finalBlob = new Blob(lastBlockChunks, { type: 'audio/webm' });
          const segId = 'seg_' + numFinal + '_' + Date.now();
          const tempoInicio = fmtSegundos(inicioSegFinal);
          const tempoFim = fmtSegundos(tempoTotalFinal);
          const finalSeg = {
            id: segId,
            numero: numFinal,
            tempoInicio,
            tempoFim,
            blobWebm: finalBlob,
            status: 'convertendo'
          };
          setSegmentos(prev => [...prev, finalSeg]);
          processarSegmento(segId, numFinal, tempoInicio, tempoFim, finalBlob);
        }

        // Gera MP3 Master da consulta inteira
        setProcessandoMaster(true);
        try {
          const masterBlob = new Blob(masterChunksRef.current, { type: 'audio/webm' });
          setAudioBlob(masterBlob);
          setAudioUrl(URL.createObjectURL(masterBlob));

          const masterBase64 = await blobParaBase64(masterBlob);
          const convRes = await fetch(API_BASE + '/api/audio/convert-mp3', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ audioBase64: masterBase64, mimeType: 'audio/webm' })
          });
          if (convRes.ok) {
            const data = await convRes.json();
            const mp3Blob = base64ToBlob(data.mp3Base64, 'audio/mp3');
            setMasterMp3Blob(mp3Blob);
            setMasterMp3Url(URL.createObjectURL(mp3Blob));
          }
        } catch (e) {
          console.warn('Erro ao gerar master MP3:', e);
        } finally {
          setProcessandoMaster(false);
        }

        mostrarAviso('Áudio da consulta finalizado! Todos os arquivos em .MP3 disponíveis para download.');
      }

      function baixarMasterMp3() {
        if (!masterMp3Blob && !audioBlob) return;
        const nomePaciente = patient.nome ? patient.nome.replace(/\s+/g, '_') : 'consulta';
        const blobToDownload = masterMp3Blob || audioBlob;
        baixarBlobMp3(blobToDownload, 'consulta_' + nomePaciente + '_COMPLETA_' + hojeISO() + '.mp3');
      }

      function baixarBlocoMp3(seg) {
        const blobToDownload = seg.mp3Blob || seg.blobWebm;
        if (!blobToDownload) return;
        const nomePaciente = patient.nome ? patient.nome.replace(/\s+/g, '_') : 'consulta';
        const tempoLimpo = seg.tempoInicio.replace(':', 'm') + '-' + seg.tempoFim.replace(':', 'm');
        baixarBlobMp3(blobToDownload, 'consulta_' + nomePaciente + '_bloco_' + seg.numero + '_' + tempoLimpo + '.mp3');
      }

      function novaConsulta() {

                else if (target === 'OE_cornea') setExamsOE(prev => ({ ...prev, cornea_photos: [...(prev.cornea_photos||[]), dataUrl] }));
                else if (target === 'ultrassom') setExamesComplementares(prev => ({ ...prev, ultrassom_photos: [...(prev.ultrassom_photos||[]), dataUrl] }));
                else setExamsOD(prev => ({ ...prev, anexos_photos: [...(prev.anexos_photos||[]), dataUrl] }));
                mostrarAviso('📸 Foto recebida do 2º celular e inserida na ficha!');
              }}
            />
          )}

          {/* Toast Notificação */}
          {aviso && (
            <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-xl ${aviso.erro ? 'bg-red-600' : 'bg-slate-900'}`}>
              {aviso.texto}
            </div>
          )}
        </div>
      );
    }

    function ModalFotoSistema({ apiBase, onFechar, onAplicar }) {
      const [imagemUrl, setImagemUrl] = useState(null);
      const [processando, setProcessando] = useState(false);
      const [erro, setErro] = useState('');
      const [nome, setNome] = useState('');
      const [especie, setEspecie] = useState('');
      const [raca, setRaca] = useState('');
      const [sexo, setSexo] = useState('');
      const [idade, setIdade] = useState('');
      const [tutor, setTutor] = useState('');
      const [tipoConsulta, setTipoConsulta] = useState('');
      const [extraido, setExtraido] = useState(false);

      function processarFile(file) {
        if (!file) return;
        setErro('');
        setProcessando(true);
        setExtraido(false);

        const reader = new FileReader();
        reader.onload = async (e) => {
          const dataUrl = e.target.result;
          setImagemUrl(dataUrl);

          try {
            const parts = dataUrl.split(',');
            const base64 = parts[1] || '';
            const mime = (parts[0].match(/:(.*?);/) || [])[1] || file.type || 'image/jpeg';

            const res = await fetch(`${apiBase}/api/gemini/extract-patient`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ imageBase64: base64, mimeType: mime })
            });

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Erro HTTP ${res.status}`);
            }

            const data = await res.json();
            setNome(data.nome || '');
            setEspecie(data.especie || '');
            setRaca(data.raca || '');
            setSexo(data.sexo || '');
            setIdade(data.idade || (data.dataNascimento ? `Nasc: ${data.dataNascimento}` : ''));
            setTutor(data.tutor || '');
            setTipoConsulta(data.tipoConsulta || 'Consulta');
            setExtraido(true);
          } catch (err) {
            setErro('Não foi possível extrair dados: ' + err.message);
          } finally {
            setProcessando(false);
          }
        };
        reader.readAsDataURL(file);
      }

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onFechar}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-xl shadow-2xl max-h-[92vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between pb-3 border-b mb-3">
              <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                <span>📸</span> Foto da Tela do Hospital (Extração com IA)
              </h3>
              <button onClick={onFechar} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-4">
              <div className="bg-blue-50/70 p-3 rounded-xl border border-blue-200 text-xs text-blue-900 leading-relaxed">
                Tire uma foto direta da tela do computador do hospital, ficha ou receituário. O Gemini identificará automaticamente os dados cadastrais!
              </div>

              <div className="flex flex-wrap gap-2 justify-center">
                <label className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold cursor-pointer shadow-xs active:scale-95 flex items-center gap-2">
                  <span>📷</span> Tirar Foto Agora
                  <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => { if (e.target.files && e.target.files[0]) processarFile(e.target.files[0]); }} />
                </label>

                <label className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl text-xs font-semibold cursor-pointer shadow-2xs active:scale-95 flex items-center gap-2">
                  <span>🖼️</span> Escolher da Galeria / Print
                  <input type="file" accept="image/*" className="hidden" onChange={(e) => { if (e.target.files && e.target.files[0]) processarFile(e.target.files[0]); }} />
                </label>
              </div>

              {processando && (
                <div className="p-4 bg-slate-50 border rounded-xl text-center text-xs text-blue-700 font-semibold animate-pulse">
                  ⏳ Analisando a foto da tela com Inteligência Artificial...
                </div>
              )}

              {erro && (
                <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700">
                  {erro}
                </div>
              )}

              {imagemUrl && (
                <div className="text-center">
                  <img src={imagemUrl} alt="Foto da tela" className="max-h-44 mx-auto rounded-lg border object-contain" />
                </div>
              )}

              {extraido && (
                <div className="bg-slate-50 p-3 rounded-xl border space-y-2 text-xs">
                  <span className="font-bold text-emerald-800 block">✓ Dados Identificados com Sucesso:</span>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 font-semibold">Nome:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={nome} onChange={(e) => setNome(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold">Tutor:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={tutor} onChange={(e) => setTutor(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold">Espécie:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={especie} onChange={(e) => setEspecie(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold">Raça:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={raca} onChange={(e) => setRaca(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold">Sexo:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={sexo} onChange={(e) => setSexo(e.target.value)} />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold">Idade:</label>
                      <input className="w-full p-1.5 border rounded-lg bg-white" value={idade} onChange={(e) => setIdade(e.target.value)} />
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="flex justify-between items-center pt-3 border-t mt-3">
              <button onClick={onFechar} className="px-4 py-2 text-slate-600 text-xs font-semibold">Cancelar</button>
              {extraido && (
                <button
                  onClick={() => onAplicar({ nome, tutor, especie, raca, sexo, idade }, tipoConsulta)}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95"
                >
                  ✅ Inserir Dados na Ficha
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ModalFotoCelular({ apiBase, patientName, onFechar, onFotoRecebida }) {
      const [sessionId, setSessionId] = useState(null);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        fetch(`${apiBase}/api/sync/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patientName: patientName || 'Paciente HVA' })
        })
        .then(r => r.json())
        .then(data => {
          if (data.sessionId) setSessionId(data.sessionId);
        })
        .catch(console.error)
        .finally(() => setCarregando(false));
      }, []);

      useEffect(() => {
        if (!sessionId) return;
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`${apiBase}/api/sync/${sessionId}/photos`);
            if (!res.ok) return;
            const data = await res.json();
            const fotos = data.photos || [];
            if (fotos.length > 0) {
              fotos.forEach(onFotoRecebida);
            }
          } catch (err) {}
        }, 2000);
        return () => clearInterval(interval);
      }, [sessionId]);

      const urlSessao = sessionId ? `${apiBase}/sync/${sessionId}` : '';
      const qrCodeUrl = sessionId ? `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(urlSessao)}&margin=10` : '';

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onFechar}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-lg shadow-2xl max-h-[92vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between pb-3 border-b mb-3">
              <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                <span>📲</span> Fotos de Outro Celular (Câmera Secundária)
              </h3>
              <button onClick={onFechar} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3 text-center text-xs text-slate-700">
              <p>Aponte a câmera do seu segundo celular para o QR Code abaixo:</p>
              {carregando ? (
                <div className="p-10 text-slate-400">Gerando código de conexão...</div>
              ) : qrCodeUrl ? (
                <div>
                  <img src={qrCodeUrl} alt="QR Code" className="w-48 h-48 mx-auto border rounded-xl shadow-xs p-1" />
                  <div className="mt-2 font-mono font-bold text-blue-700 bg-blue-50 py-1 px-3 rounded-lg inline-block">
                    Sessão: {sessionId}
                  </div>
                </div>
              ) : (
                <div className="text-red-500">Erro ao carregar conexão.</div>
              )}
              <p className="text-[11px] text-slate-500">Ao abrir no celular, escolha se a foto é de OD, OE, Córnea ou Ultrassom e tire a foto. Ela aparecerá aqui instantaneamente!</p>
            </div>

            <div className="flex justify-end pt-3 border-t mt-3">
              <button onClick={onFechar} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Concluir</button>
            </div>
          </div>
        </div>
      );
    }

    function ModalBuscaFichas({ onFechar, onAbrir }) {
      const [fichas, setFichas] = useState([]);
      const [q, setQ] = useState('');

      useEffect(() => {
        FichasDB.listar().then(setFichas);
      }, []);

      const filtradas = fichas.filter((f) => {
        const termo = normalizarTexto(q);
        if (!termo) return true;
        const texto = normalizarTexto(`${f.paciente.nome} ${f.paciente.tutor} ${f.paciente.especie} ${f.paciente.raca}`);
        return texto.includes(termo);
      });

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onFechar}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-2xl shadow-xl max-h-[85vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <h3 className="font-bold text-base mb-3">🔍 Buscar Fichas Salvas no Dispositivo</h3>
            <input
              type="text"
              placeholder="Buscar por nome do paciente, tutor, espécie ou raça..."
              className="w-full px-3 py-2 border rounded-xl text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
              value={q}
              onChange={(e) => setQ(e.target.value)}
              autoFocus
            />

            <div className="flex-1 overflow-y-auto space-y-2 mb-3">
              {filtradas.length === 0 ? (
                <p className="text-xs text-slate-400 py-6 text-center">Nenhuma ficha encontrada.</p>
              ) : (
                filtradas.map((f) => {
                  const ultimo = f.atendimentos[f.atendimentos.length - 1] || {};
                  return (
                    <div key={f.id} className="p-3 border rounded-xl flex items-center justify-between hover:bg-slate-50">
                      <div>
                        <div className="font-bold text-sm text-blue-950">{f.paciente.nome || 'Sem nome'}</div>
                        <div className="text-xs text-slate-500">
                          Tutor: {f.paciente.tutor || '—'} · {f.paciente.especie || '—'} {f.paciente.raca || ''} · {f.atendimentos.length} atendimento(s)
                        </div>
                      </div>
                      <button
                        onClick={() => onAbrir(f, ultimo)}
                        className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold"
                      >
                        Abrir
                      </button>
                    </div>
                  );
                })
              )}
            </div>

            <div className="flex justify-between items-center pt-2 border-t text-xs">
              <button
                onClick={() => {
                  FichasDB.listar().then((todas) => {
                    const blob = new Blob([JSON.stringify(todas, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `backup_fichas_hva_${hojeISO()}.json`;
                    a.click();
                  });
                }}
                className="text-blue-600 font-semibold underline"
              >
                ⬇️ Exportar Backup de Todas as Fichas
              </button>
              <button onClick={onFechar} className="px-4 py-2 bg-slate-200 rounded-xl text-slate-700">Fechar</button>
            </div>
          </div>
        </div>
      );
    }

    try {
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      } else {
        ReactDOM.render(<App />, document.getElementById('root'));
      }
    } catch (e) {
      console.error(e);
      ReactDOM.render(<App />, document.getElementById('root'));
    }
  </script>
</body>
</html>
